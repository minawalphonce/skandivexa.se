name: Build, release and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 14

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Zip build output
        run: (cd dist && zip -qr ../skandivexa-dist.zip .)

      # Tags the current commit as vN (N = this workflow's run number) and
      # creates a GitHub Release with the zipped dist/ folder attached, so
      # it can be downloaded from the repo's Releases page.
      - name: Create tag + release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Build v${{ github.run_number }}
          body: |
            Automated build from commit ${{ github.sha }}.
            Download `skandivexa-dist.zip` below and upload its contents to your web host.
          files: skandivexa-dist.zip

  deploy-ftps:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      # Loopia's hosting account uses FTPS (FTP over explicit TLS, port 21),
      # not SFTP (SSH, port 22) -- the earlier attempts at this deploy step
      # all used SFTP-only tools and never had a chance of connecting.
      # LFTP_PASSWORD is not a separate secret: it's just the env var name
      # lftp's own "open --env-password" flag reads from, set here from the
      # FTP_PASSWORD secret.
      - name: Upload dist/ to Loopia via FTPS
        env:
          FTP_HOST: ${{ vars.FTP_HOST || 'ftpcluster.loopia.se' }}
          FTP_PORT: ${{ vars.FTP_PORT || '21' }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_REMOTE_DIR: ${{ vars.FTP_REMOTE_DIR || 'skandivexa.se/public_html' }}
        run: |
          if [ -z "$FTP_USERNAME" ] || [ -z "$LFTP_PASSWORD" ]; then
            echo "::error::FTP_USERNAME or FTP_PASSWORD secret is not set. Go to Settings > Secrets and variables > Actions and add both."
            exit 1
          fi
          lftp -e "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set net:max-retries 2;
            set net:timeout 30;
            open --env-password -u $FTP_USERNAME -p $FTP_PORT ftp://$FTP_HOST;
            cd $FTP_REMOTE_DIR;
            mirror --reverse --delete --verbose --parallel=4 --exclude-glob .htaccess --exclude .well-known/ dist/ .;
            bye
          "
