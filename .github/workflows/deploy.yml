name: Build and deploy to Loopia

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Upload to Loopia via SFTP
        env:
          SFTP_HOST: ${{ vars.SFTP_HOST || 'ftpcluster.loopia.se' }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_REMOTE_DIR: ${{ vars.SFTP_REMOTE_DIR || '/skandivexa.se/public_html' }}
        run: |
          # Strip whitespace, newlines and surrounding quotes that often sneak in
          # when pasting the secret into GitHub.
          user="$(printf '%s' "$SFTP_USERNAME" | tr -d '\r\n' | sed -e 's/^[[:space:]"'\'']*//' -e 's/[[:space:]"'\'']*$//')"
          LFTP_PASSWORD="$(printf '%s' "$LFTP_PASSWORD" | tr -d '\r\n')"
          export LFTP_PASSWORD

          if [ -z "$user" ]; then
            echo "::error::SFTP_USERNAME secret is empty"; exit 1
          fi
          if printf '%s' "$user" | grep -q '[[:space:]'\''"`;&|<>(){}]'; then
            echo "::error::SFTP_USERNAME contains spaces or special characters (quotes, ; & | < > etc). Re-enter the secret with only the username, e.g. admin_web"
            exit 1
          fi
          echo "Username length: ${#user} characters (admin_web = 9)"
          echo "Uploading ./dist -> $SFTP_REMOTE_DIR on $SFTP_HOST"

          # Upload the Vite build output folder "dist/" (created by "bun run build")
          # into the remote web root.
          lftp -e "
            set sftp:auto-confirm yes;
            set net:max-retries 2;
            set net:timeout 30;
            open --env-password -u \"$user\" sftp://$SFTP_HOST;
            cd \"$SFTP_REMOTE_DIR\";
            mirror --reverse --delete --verbose --parallel=4 --exclude-glob .htaccess --exclude .well-known/ dist/ .;
            bye
          "
