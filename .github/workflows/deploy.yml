name: Build and deploy to Loopia

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Install deploy script dependencies
        run: npm ci --no-audit --no-fund
        working-directory: .github/scripts

      # Uploads the Vite build output folder "dist/" (created by "bun run
      # build" above) to the Loopia web root, and removes remote files that
      # are no longer part of the build. Uses ssh2-sftp-client (pure JS)
      # instead of lftp/rclone, which both hit runner-specific issues
      # talking to Loopia's SFTP server (lftp: invalid ssh args on this
      # runner image; rclone: connection hangs without erroring).
      - name: Upload dist/ to Loopia via SFTP
        env:
          SFTP_HOST: ${{ vars.SFTP_HOST || 'ftpcluster.loopia.se' }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_REMOTE_DIR: ${{ vars.SFTP_REMOTE_DIR || '/skandivexa.se/public_html' }}
          LOCAL_DIR: dist
        run: node .github/scripts/deploy.mjs
