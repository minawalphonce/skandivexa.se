name: Build and release dist

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Zip build output
        run: (cd dist && zip -qr ../skandivexa-dist.zip .)

      # Tags the current commit as vN (N = this workflow's run number) and
      # creates a GitHub Release with the zipped dist/ folder attached, so
      # it can be downloaded from the repo's Releases page.
      - name: Create tag + release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Build v${{ github.run_number }}
          body: |
            Automated build from commit ${{ github.sha }}.
            Download `skandivexa-dist.zip` below and upload its contents to your web host.
          files: skandivexa-dist.zip
